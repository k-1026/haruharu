<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야시장 오늘의 매대판</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --ink: #1f1d1a;
    --sub: #6b655c;
    --line: #e7e1d7;
    --accent: #d9534f;
    --accent-ink: #ffffff;
    --open: #2e7d4f;
    --open-bg: #e3f4ea;
    --wait: #8a6d1d;
    --wait-bg: #fbf1d4;
    --closed: #6b655c;
    --closed-bg: #ece9e3;
    --soldout: #b23a36;
    --soldout-bg: #fbe3e1;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181614;
      --card: #242120;
      --ink: #f2eee8;
      --sub: #a69e92;
      --line: #3a3531;
      --accent: #ff7a73;
      --accent-ink: #181614;
      --open: #6fd196;
      --open-bg: #1f3a2a;
      --wait: #e8c96a;
      --wait-bg: #3d3520;
      --closed: #a69e92;
      --closed-bg: #2e2b28;
      --soldout: #ff8e89;
      --soldout-bg: #4a2624;
    }
  }
  :root[data-theme="dark"] {
    --bg: #181614;
    --card: #242120;
    --ink: #f2eee8;
    --sub: #a69e92;
    --line: #3a3531;
    --accent: #ff7a73;
    --accent-ink: #181614;
    --open: #6fd196;
    --open-bg: #1f3a2a;
    --wait: #e8c96a;
    --wait-bg: #3d3520;
    --closed: #a69e92;
    --closed-bg: #2e2b28;
    --soldout: #ff8e89;
    --soldout-bg: #4a2624;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  header {
    padding: 28px 0 16px;
  }
  .eyebrow {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: .02em;
  }
  h1 {
    margin: 4px 0 6px;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 800;
  }
  .date {
    color: var(--sub);
    font-size: 14px;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 16px 0 14px;
  }
  .summary div {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 8px;
    text-align: center;
  }
  .summary strong {
    display: block;
    font-size: 20px;
    font-weight: 800;
  }
  .summary span {
    font-size: 12px;
    color: var(--sub);
  }

  .search {
    width: 100%;
    font: inherit;
    font-size: 16px; /* prevents iOS zoom */
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 4px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    font: inherit;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
  }

  .list {
    display: grid;
    gap: 12px;
    margin-top: 12px;
  }
  .stall {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .stall-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .stall-no {
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    letter-spacing: .04em;
  }
  .stall-name {
    margin: 2px 0 0;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.3;
    word-break: keep-all;
  }
  .badge {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.open     { color: var(--open);     background: var(--open-bg); }
  .badge.wait     { color: var(--wait);     background: var(--wait-bg); }
  .badge.closed   { color: var(--closed);   background: var(--closed-bg); }
  .badge.soldout  { color: var(--soldout);  background: var(--soldout-bg); }

  .menu {
    margin: 10px 0 0;
    font-size: 15px;
    color: var(--ink);
    word-break: keep-all;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--sub);
  }
  .meta b { color: var(--ink); font-weight: 700; }

  .empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
  }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--sub);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">야시장 · 오늘의 매대판</div>
    <h1>오늘 문 여는 매대</h1>
    <div class="date" id="today"></div>
  </header>

  <section class="summary" aria-label="요약">
    <div><strong id="cnt-open">0</strong><span>영업중</span></div>
    <div><strong id="cnt-wait">0</strong><span>오픈 전</span></div>
    <div><strong id="cnt-all">0</strong><span>전체 매대</span></div>
  </section>

  <input class="search" id="q" type="search" placeholder="매대명 · 메뉴 검색" aria-label="검색">

  <nav class="chips" id="chips" aria-label="카테고리"></nav>

  <main class="list" id="list"></main>

  <footer>
    ※ 이 화면의 매대 정보는 예시 데이터입니다. 실제 운영 시간·메뉴·품절 여부는 현장에서 확인해 주세요.
    영업 상태는 기기 시간 기준으로 자동 계산됩니다.
  </footer>
</div>

<script>
  // 매대 데이터 (예시). open/close는 24시간제 "HH:MM", soldout은 오늘 품절 여부.
  const STALLS = [
    { no: "A-01", name: "꼬치 한 상",        cat: "먹거리",   menu: "양념 닭꼬치 · 대파 삼겹꼬치", price: "3,000원~", open: "18:00", close: "23:00", soldout: false, note: "매운맛 조절 가능" },
    { no: "A-02", name: "호떡 할매",          cat: "간식",     menu: "흑설탕 호떡 · 견과 호떡",     price: "2,000원~", open: "17:30", close: "22:30", soldout: false, note: "현금 할인 500원" },
    { no: "A-03", name: "야끼소바 1번가",     cat: "먹거리",   menu: "야끼소바 · 오징어 볶음",      price: "6,000원~", open: "18:00", close: "23:30", soldout: true,  note: "오징어 품절" },
    { no: "B-01", name: "레몬에이드 공방",    cat: "음료",     menu: "레몬에이드 · 자몽에이드",     price: "4,000원",  open: "17:00", close: "23:00", soldout: false, note: "얼음 추가 무료" },
    { no: "B-02", name: "붕어빵 굽는 집",     cat: "간식",     menu: "팥 붕어빵 · 슈크림 붕어빵",   price: "1,000원~", open: "18:30", close: "22:00", soldout: false, note: "" },
    { no: "B-03", name: "버터구이 옥수수",    cat: "먹거리",   menu: "버터 옥수수 · 치즈 옥수수",   price: "3,500원",  open: "18:00", close: "23:00", soldout: false, note: "" },
    { no: "C-01", name: "핸드메이드 키링",    cat: "소품",     menu: "키링 · 자수 파우치",          price: "5,000원~", open: "19:00", close: "23:30", soldout: false, note: "주문 제작 가능" },
    { no: "C-02", name: "달고나 뽑기",        cat: "간식",     menu: "달고나 · 솜사탕",             price: "2,000원~", open: "18:00", close: "22:30", soldout: false, note: "" },
    { no: "C-03", name: "전통 수제 음료",     cat: "음료",     menu: "오미자 에이드 · 식혜",        price: "3,000원",  open: "17:30", close: "22:00", soldout: false, note: "무가당 선택 가능" },
    { no: "D-01", name: "떡볶이 골목",        cat: "먹거리",   menu: "떡볶이 · 순대 · 튀김",        price: "4,000원~", open: "18:00", close: "23:00", soldout: false, note: "" }
  ];

  const CATS = ["전체", "먹거리", "간식", "음료", "소품"];

  let currentCat = "전체";
  let query = "";

  function toMin(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
  }

  // 현재 시각 기준 상태: soldout → 품절, 영업시간 전 → 오픈 전, 안 → 영업중, 이후 → 마감
  function statusOf(s, now) {
    if (s.soldout) return { key: "soldout", label: "품절" };
    const t = now.getHours() * 60 + now.getMinutes();
    const o = toMin(s.open);
    const c = toMin(s.close);
    if (t < o) return { key: "wait", label: "오픈 전 · " + s.open };
    if (t < c) return { key: "open", label: "영업중" };
    return { key: "closed", label: "마감" };
  }

  function formatToday(d) {
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${days[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())} 기준`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    const now = new Date();
    document.getElementById("today").textContent = formatToday(now);

    const statuses = STALLS.map(s => ({ s, st: statusOf(s, now) }));

    const openCount = statuses.filter(x => x.st.key === "open").length;
    const waitCount = statuses.filter(x => x.st.key === "wait").length;
    document.getElementById("cnt-open").textContent = openCount;
    document.getElementById("cnt-wait").textContent = waitCount;
    document.getElementById("cnt-all").textContent = STALLS.length;

    // 카테고리 칩
    const chipBox = document.getElementById("chips");
    chipBox.innerHTML = CATS.map(c =>
      `<button class="chip" type="button" aria-pressed="${c === currentCat}" data-cat="${c}">${c}</button>`
    ).join("");

    const q = query.trim().toLowerCase();
    const filtered = statuses.filter(({ s }) => {
      const catOk = currentCat === "전체" || s.cat === currentCat;
      const text = (s.name + " " + s.menu + " " + s.no + " " + s.cat).toLowerCase();
      const qOk = !q || text.includes(q);
      return catOk && qOk;
    });

    const list = document.getElementById("list");
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">조건에 맞는 매대가 없습니다.</div>`;
      return;
    }

    list.innerHTML = filtered.map(({ s, st }) => `
      <article class="stall">
        <div class="stall-top">
          <div>
            <div class="stall-no">${escapeHtml(s.no)} · ${escapeHtml(s.cat)}</div>
            <h2 class="stall-name">${escapeHtml(s.name)}</h2>
          </div>
          <span class="badge ${st.key}">${escapeHtml(st.label)}</span>
        </div>
        <p class="menu">${escapeHtml(s.menu)}</p>
        <div class="meta">
          <span>가격 <b>${escapeHtml(s.price)}</b></span>
          <span>운영 <b>${escapeHtml(s.open)}–${escapeHtml(s.close)}</b></span>
          ${s.note ? `<span>💬 ${escapeHtml(s.note)}</span>` : ""}
        </div>
      </article>
    `).join("");
  }

  document.getElementById("chips").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    currentCat = btn.dataset.cat;
    render();
  });

  document.getElementById("q").addEventListener("input", e => {
    query = e.target.value;
    render();
  });

  render();
  // 상태(영업중/오픈 전/마감)가 시간에 따라 바뀌므로 1분마다 갱신
  setInterval(render, 60 * 1000);
</script>
</body>
</html>
