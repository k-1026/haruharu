<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레드팀 모니터 — 야시장 BM 캔버스</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #ffffff; --ink: #1f2328; --muted: #5b6470; --line: #d9d4c7;
    --accent: #b5532b; --ok: #2e7d4f; --no: #8a2b2b; --neon: #39ff14;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a1f; --card: #20262d; --ink: #e8ecf1; --muted: #9aa5b1; --line: #35404c;
      --accent: #e0875a; --ok: #5cc38a; --no: #e07a7a; --neon: #39ff14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a1f; --card: #20262d; --ink: #e8ecf1; --muted: #9aa5b1; --line: #35404c;
    --accent: #e0875a; --ok: #5cc38a; --no: #e07a7a; --neon: #39ff14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 6px 12px;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  button.sel-ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.sel-fix { background: #1f6fb2; color: #fff; border-color: #1f6fb2; }
  button.sel-no { background: var(--no); color: #fff; border-color: var(--no); }

  /* 실행 중 형광 깜빡임 */
  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .agent {
    border: 2px solid var(--line); border-radius: 10px; padding: 12px; text-align: center;
  }
  .agent .state { font-weight: 700; margin-top: 4px; }
  .agent.running {
    border-color: var(--neon); color: #0b0f0a; background: var(--neon);
    animation: neon 0.5s steps(2, start) infinite alternate;
  }
  .agent.running .state, .agent.running .muted { color: #0b0f0a; }
  .agent.done { border-color: var(--ok); }
  .agent.done .state { color: var(--ok); }
  @keyframes neon {
    from { box-shadow: 0 0 6px var(--neon); opacity: 1; }
    to   { box-shadow: 0 0 22px var(--neon); opacity: 0.55; }
  }
  .run-state { font-weight: 700; }
  .run-state.running { color: var(--neon); text-shadow: 0 0 6px var(--neon); animation: blink 0.5s steps(2, start) infinite; }
  @keyframes blink { to { opacity: 0.3; } }

  .log { max-height: 180px; overflow: auto; font-size: 13px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .log div { padding: 2px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.act { white-space: nowrap; }
  td.act button { padding: 3px 8px; margin-right: 4px; font-size: 12px; }
  textarea {
    width: 100%; min-height: 48px; margin-top: 4px; font: inherit; font-size: 13px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px;
  }
  .sev-상 { color: var(--no); font-weight: 700; }
  .sev-중 { color: var(--accent); font-weight: 700; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .count { font-size: 13px; color: var(--muted); }
  @media (max-width: 720px) {
    .agents { grid-template-columns: 1fr; }
    table, thead, tbody, tr, th, td { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
    td { border: none; padding: 2px 0; }
  }
</style>
</head>
<body>

<section>
  <h1>레드팀 모니터 — 야시장 오늘의 매대판 BM 캔버스</h1>
  <div class="muted">대상: <code>bm/bm_canvas.md</code> · 결과: <code>bm/redteam_log.md</code> · 원문: <code>bm/redteam/</code></div>
  <div class="toolbar">
    <button class="primary" id="btnRun">실행 (레드팀 3개)</button>
    <span class="run-state" id="runState">대기 중</span>
    <span class="muted" id="runHint"></span>
  </div>
  <div class="muted" style="margin-top:6px">실행 버튼은 실행 문구("레드팀 실행")를 클립보드에 복사합니다. 세션에 붙여넣으면 세 에이전트가 동시에 돌고, 이 화면의 상태 표시가 바뀝니다.</div>
</section>

<section>
  <h2>실행 상태</h2>
  <div class="agents" id="agents"></div>
  <div class="log" id="log"></div>
</section>

<section id="decisionSection" style="display:none">
  <h2>사람 결정 항목</h2>
  <div class="muted">
    <b>수용</b>: 버튼만 기록 (캔버스는 아직 안 고침) · <b>수정</b>: 아래 칸에 고친 문장을 적고 기록 · <b>반려</b>: 의견 무시
  </div>
  <div class="toolbar">
    <button id="btnExport">결정 내려받기 (decisions.json)</button>
    <button class="primary" id="btnApply">캔버스 반영 (수용 + 수정 일괄)</button>
    <button id="btnClear">결정 지우기</button>
    <span class="count" id="count"></span>
  </div>
  <div style="overflow-x:auto; margin-top:10px">
    <table>
      <thead><tr><th>번호</th><th>출처</th><th>대상 칸</th><th>지적</th><th>심각도</th><th>결정</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

<script>
window.REVIEW_ITEMS = [
  { id: "I-1", agent: "투자자", target: "⑨ 수익원", summary: "월 수익이 상인회 1곳에 전부 기댐. 방문객 과금 없음", severity: "상" },
  { id: "I-2", agent: "투자자", target: "⑨ 수익 숫자", summary: "5천~1만 원 확인값은 원자료 파일 없음. 1만 원 · 80곳이 가상 데이터와 같은 숫자", severity: "상" },
  { id: "I-3", agent: "투자자", target: "⑧ 비용 · 손익", summary: "비용 금액 전부 미확인. 손익분기 · 투자금 회수 항목 없음", severity: "상" },
  { id: "I-4", agent: "투자자", target: "⑧ 비용 누락", summary: "대면 안내 인력 · 이동, 법적 검토 · 약관 대응, 가림 이미지 보관, AI 호출, 신고 응대 인력이 빠짐", severity: "중" },
  { id: "I-5", agent: "투자자", target: "⑧ · ⑤ 확장 비용", summary: "매대 증가 시 사무국 작업이 선형으로 늘어남. 사람 승인이 병목", severity: "상" },
  { id: "I-6", agent: "투자자", target: "⑥ · ⑨ 데이터 전제", summary: "D5 데이터가 운영 후 생기고 초기 확보 방법 미확인. 데이터 없이 지불 가치 성립 근거 없음", severity: "상" },
  { id: "I-7", agent: "투자자", target: "② 근거", summary: "P1 '직접' 판정의 근거 점수 60이 VOC 미확인 가정값", severity: "중" },
  { id: "I-8", agent: "투자자", target: "전체 · ④ · ⑤ 책임", summary: "확인 · 수정 · 신고 · 비용을 사무국에 몰았고, 사무국이 지불 주체도 됨. 지불 중단 시 운영 전체 정지", severity: "상" },
  { id: "C-1", agent: "고객", target: "① 고객 세그먼트", summary: "'현금 없는 방문객'은 P1 행위자 전체를 못 담음. 카드 소지 구매자, 외국인 동반 방문 빠짐", severity: "중" },
  { id: "C-2", agent: "고객", target: "② · ⑤ 3단계", summary: "'오늘 영업 여부'가 사무국 승인 뒤 게시됨. 승인 기한 · 미승인 표시 방식 미정", severity: "상" },
  { id: "C-3", agent: "고객", target: "② 품절 · ⑤ 입력", summary: "품절은 상인 버튼만으로 확정. 상인이 버튼을 쓸 수 있는지는 추정이고 인터뷰도 없음", severity: "상" },
  { id: "C-4", agent: "고객", target: "③ 채널", summary: "QR은 현장에서만 닿음. P2는 방문 전 탐색에서 생기는 문제. 방문 전 채널 기각 근거가 저작권뿐", severity: "상" },
  { id: "C-5", agent: "고객", target: "② · ③ 대체 수단", summary: "고객의 현재 대체 행동(매대에 직접 묻기, 현금 준비, ATM 등)이 캔버스에 없음", severity: "중" },
  { id: "C-6", agent: "고객", target: "⑨ · ① 지불 주체", summary: "지불자는 상인회인데 실제로는 상인이 자릿세를 냄. 입력 노동을 하는 상인의 가치가 칸 ②에 없음", severity: "상" },
  { id: "C-7", agent: "고객", target: "⑨ 수익 숫자", summary: "설문 응답자 · 표본 · 조사 시점 미기재. 1만 원 상한이 독립 근거가 아님", severity: "상" },
  { id: "C-8", agent: "고객", target: "④ · ⑤ 신고", summary: "방문객이 신고하는 동기 · 절차 · 결과 통보가 없음. 수정 기한 목표 미정", severity: "중" },
  { id: "R-1", agent: "경쟁자", target: "② · ⑥", summary: "결제 · 영업 표시는 지도 앱 등록 정보와 겹쳐 복제가 쉬움. 차별점이 '한 화면 카드'뿐", severity: "상" },
  { id: "R-2", agent: "경쟁자", target: "전체 · ⑥ 진입장벽", summary: "⑥이 '대체 가능'으로 판정됨. 데이터 해자는 수정 쌍 축적에 기대지만 목표 · 확보 방법 미정", severity: "상" },
  { id: "R-3", agent: "경쟁자", target: "⑦ · ⑨", summary: "파트너 · 지불자가 상인회 한 곳. 경쟁자나 상인회 내재화가 먼저 계약하면 수익과 채널이 함께 끊김", severity: "상" },
  { id: "R-4", agent: "경쟁자", target: "⑨ · ⑧", summary: "경쟁 무료화 시 정액 수익 흔들림. 지불 의사 원자료 미확보. 비용 금액 미확인", severity: "상" },
  { id: "R-5", agent: "경쟁자", target: "③ · 전체 대체재", summary: "지도 앱 · 블로그 · SNS · 상인회 공지 · 손글씨 · 직접 묻기가 경쟁 대상으로 안 나옴. 경쟁 · 시장 자료 없음", severity: "상" },
  { id: "R-6", agent: "경쟁자", target: "③ · ⑦", summary: "QR 안내판 부착 공간 · 허가 주체 근거 없음. 지도 앱 약관 미확인으로 채널 선점 판단 불가", severity: "중" },
  { id: "R-7", agent: "경쟁자", target: "전체 차별화", summary: "'결제 정보 없음'의 차별화 근거 자료 없음. VOC 원자료 미독. 원자료는 가상 데이터 표시", severity: "중" }
];
</script>
<script>
(function () {
  var STORE_KEY = "bm_redteam_decisions_v1";
  var itemsCache = [];
  var decisions = {};
  try { decisions = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { decisions = {}; }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(decisions)); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- 결정 표 ----------
  function renderRows() {
    var tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    itemsCache.forEach(function (it) {
      var d = decisions[it.id] || { decision: "", edited: "" };
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(it.id) + "</td>" +
        "<td>" + esc(it.agent) + "</td>" +
        "<td>" + esc(it.target) + "</td>" +
        "<td>" + esc(it.summary) +
          (d.decision === "수정"
            ? '<textarea data-edit="' + esc(it.id) + '" placeholder="고친 문장을 적으세요">' + esc(d.edited || "") + "</textarea>"
            : "") +
        "</td>" +
        '<td class="sev-' + esc(it.severity) + '">' + esc(it.severity) + "</td>" +
        '<td class="act">' +
          btn(it.id, "수용", d.decision) +
          btn(it.id, "수정", d.decision) +
          btn(it.id, "반려", d.decision) +
        "</td>";
      tbody.appendChild(tr);
    });
    updateCount();
  }

  function btn(id, label, current) {
    var cls = current === label ? " sel-" + (label === "수용" ? "ok" : label === "수정" ? "fix" : "no") : "";
    return '<button class="' + cls.trim() + '" data-id="' + esc(id) + '" data-decision="' + label + '">' + label + "</button>";
  }

  function updateCount() {
    var total = itemsCache.length;
    var done = itemsCache.filter(function (it) { return decisions[it.id] && decisions[it.id].decision; }).length;
    var apply = itemsCache.filter(function (it) {
      var d = decisions[it.id]; return d && (d.decision === "수용" || d.decision === "수정");
    }).length;
    document.getElementById("count").textContent =
      "결정 " + done + " / " + total + " · 캔버스 반영 대상 " + apply + "건 · 빈 결정 " + (total - done) + "건";
  }

  document.getElementById("rows").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-decision]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    var label = b.getAttribute("data-decision");
    var d = decisions[id] || { decision: "", edited: "" };
    d.decision = label;
    decisions[id] = d;
    save();
    renderRows();
  });

  document.getElementById("rows").addEventListener("input", function (e) {
    var t = e.target;
    if (t.tagName !== "TEXTAREA") return;
    var id = t.getAttribute("data-edit");
    var d = decisions[id] || { decision: "수정", edited: "" };
    d.edited = t.value;
    decisions[id] = d;
    save();
  });

  function buildPayload() {
    return itemsCache.map(function (it) {
      var d = decisions[it.id] || {};
      return { id: it.id, agent: it.agent, target: it.target, summary: it.summary,
               decision: d.decision || "", edited: d.edited || "" };
    });
  }

  function download(name, text) {
    var blob = new Blob([text], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  document.getElementById("btnExport").addEventListener("click", function () {
    download("decisions.json", JSON.stringify(buildPayload(), null, 2));
  });

  document.getElementById("btnApply").addEventListener("click", function () {
    var list = buildPayload().filter(function (r) { return r.decision === "수용" || r.decision === "수정"; });
    download("decisions.json", JSON.stringify(buildPayload(), null, 2));
    var text = "캔버스 반영";
    copy(text);
    alert("캔버스 반영 대상 " + list.length + "건을 decisions.json으로 내려받았습니다.\n" +
          "세션에 '캔버스 반영'을 붙여넣으면 수용·수정 항목만 bm/bm_canvas.md에 일괄 반영됩니다.");
  });

  document.getElementById("btnClear").addEventListener("click", function () {
    if (!confirm("모든 결정을 지울까요?")) return;
    decisions = {};
    save();
    renderRows();
  });

  // ---------- 실행 버튼 ----------
  function copy(text) {
    try { navigator.clipboard.writeText(text); } catch (e) {}
  }

  document.getElementById("btnRun").addEventListener("click", function () {
    copy("레드팀 실행");
    runRequestedAt = Date.now();
    try { localStorage.setItem("bm_run_requested", String(runRequestedAt)); } catch (e) {}
    lastStatusText = "";
    renderStatus();
    document.getElementById("runHint").textContent = "'레드팀 실행'을 복사했습니다. 세션에 붙여넣으면 실행 상태가 바뀝니다.";
  });

  // ---------- 실행 상태 (status.js 를 주기적으로 다시 읽음) ----------
  var lastStatusText = "";
  var runRequestedAt = 0;
  function loadStatus() {
    var old = document.getElementById("status-script");
    if (old) old.remove();
    var s = document.createElement("script");
    s.id = "status-script";
    s.src = "redteam/status.js?t=" + Date.now();
    s.onload = renderStatus;
    s.onerror = function () { renderStatus(); };
    document.body.appendChild(s);
  }

  function renderStatus() {
    var st = window.REDTEAM_STATUS || {
      state: "idle",
      agents: {
        investor: { name: "투자자", state: "idle", updated: "" },
        customer: { name: "고객", state: "idle", updated: "" },
        competitor: { name: "경쟁자", state: "idle", updated: "" }
      },
      log: []
    };
    var requested = false;
    var savedAt = 0;
    try { savedAt = Number(localStorage.getItem("bm_run_requested") || 0); } catch (e) {}
    savedAt = Math.max(savedAt, runRequestedAt);
    requested = Date.now() - savedAt < 1800000 && savedAt > 0;
    if (st.state === "idle" && requested) {
      st = JSON.parse(JSON.stringify(st));
      st.state = "running";
      Object.keys(st.agents || {}).forEach(function (k) {
        st.agents[k].state = "running";
        st.agents[k].updated = "요청됨";
      });
    }
    var text = JSON.stringify(st);
    if (text === lastStatusText) return;
    lastStatusText = text;

    // 결정 항목은 검토가 끝난(done) 실행 결과가 있을 때만 보인다
    var sec = document.getElementById("decisionSection");
    var showItems = st.state === "done" && Array.isArray(st.items) && st.items.length > 0;
    sec.style.display = showItems ? "" : "none";
    itemsCache = showItems ? st.items : [];
    renderRows();

    var running = st.state === "running";
    var runState = document.getElementById("runState");
    runState.textContent = running ? "실행 중 (레드팀 3개 동시)" : (st.state === "done" ? "검토 완료" : "대기 중");
    runState.className = "run-state" + (running ? " running" : "");

    var wrap = document.getElementById("agents");
    wrap.innerHTML = "";
    Object.keys(st.agents || {}).forEach(function (k) {
      var a = st.agents[k];
      var cls = "agent " + (a.state === "running" ? "running" : a.state === "done" ? "done" : "");
      var label = a.state === "running" ? "실행 중" : a.state === "done" ? "완료" : "대기";
      var div = document.createElement("div");
      div.className = cls;
      div.innerHTML = "<b>" + esc(a.name) + "</b><div class='state'>" + label + "</div>" +
                      "<div class='muted'>" + esc(a.updated || "") + "</div>";
      wrap.appendChild(div);
    });

    var log = document.getElementById("log");
    log.innerHTML = (st.log || []).slice().reverse().map(function (l) {
      return "<div>" + esc(l.time || "") + " · " + esc(l.message || "") + "</div>";
    }).join("") || "<div class='muted'>아직 기록 없음</div>";
  }

  renderRows();
  loadStatus();
  setInterval(loadStatus, 2000);
})();
</script>
</body>
</html>
