<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루하루 · 서비스 운영 로그</title><link rel="stylesheet" href="/admin/logs.css"><script defer src="/admin/logs.js"></script></head>
<body><header><div><strong>서비스 운영 로그</strong><p>서비스 제공자용 관리자 · 실행·검사·오류 기록 조회</p></div><nav aria-label="서비스 화면"><a href="/plan/">코스 기획 ↗</a><a href="/admin/" aria-current="page">서비스 운영 로그</a><a href="/admin/places-review">장소 위치 확인</a></nav></header>
<main><section class="intro"><h1>서비스 운영 현황</h1><p>서비스 운영자 전용 · 실행 상태와 실패 원인을 확인합니다. 기획 직원은 <a href="/plan/">코스 기획 화면</a>을 이용합니다.</p></section>
<div class="workspace"><aside><div class="listhead"><h2>저장된 실행</h2><button id="refresh" type="button">새로고침</button></div><div id="runs"><p>불러오는 중…</p></div></aside>
<section class="viewer" aria-label="실행 진단"><h2 id="recordTitle">실행을 선택하세요</h2><p id="notice" role="status"></p><div id="diagnosis" aria-live="polite"></div><div id="meta"></div><details id="rawLogs"><summary>상세 기록 · JSON / Markdown 원문</summary><div class="raw-content"><label for="logFile">조회할 기록</label><select id="logFile" disabled><option>기록을 선택하세요</option></select><pre id="logBody" tabindex="0">실행을 선택하면 원문을 볼 수 있습니다.</pre></div></details></section></div></main></body></html>
