<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루하루 · 서비스 운영 로그</title><link rel="stylesheet" href="/admin/logs.css"><script defer src="/admin/logs.js"></script></head>
<body><header><div><strong>서비스 운영 로그</strong><p>서비스 제공자용 관리자 · 실행·검사·오류 기록 조회</p></div><a href="/plan/">코스 기획 화면 ↗</a></header>
<main><section class="intro"><h1>실행 기록을 확인하세요</h1><p>이 화면은 로그 조회 전용입니다. 코스 조건을 입력하거나 수정·확정·AI 실행을 하지 않습니다.</p></section>
<div class="workspace"><aside><div class="listhead"><h2>저장된 실행</h2><button id="refresh" type="button">새로고침</button></div><div id="runs"><p>불러오는 중…</p></div></aside>
<section class="viewer"><h2 id="recordTitle">실행을 선택하세요</h2><p id="notice" role="status"></p><div id="meta"></div><label for="logFile">조회할 기록</label><select id="logFile" disabled><option>기록을 선택하세요</option></select><pre id="logBody" tabindex="0">왼쪽에서 실행을 선택하면 단계 결과·검사·총괄 진행 기록을 볼 수 있습니다.</pre></section></div></main></body></html>
