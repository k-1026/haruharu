  <text x="90" y="1425" class="muted small">포롱이</text><text x="90" y="1460" class="kr body">“시장 냄새가 여기까지 나! 뭐부터 먹어볼까?”</text>
  <text x="90" y="1510" class="muted small">여울이</text><text x="90" y="1545" class="kr body">“점심은 서문시장에서 먹고 다음 장소로 이동하자.”</text>

