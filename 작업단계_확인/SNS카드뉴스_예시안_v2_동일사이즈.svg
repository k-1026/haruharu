<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1900" viewBox="0 0 1500 1900">
  <rect width="1500" height="1900" fill="#ece8df"/>
  <style>
    .t{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#202a49}.w{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#fff}.m{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#73798a}.sm{font-size:16px}.md{font-size:21px}.lg{font-size:28px;font-weight:700}.xl{font-size:38px;font-weight:700}.orange{fill:#e98c19}.navy{fill:#273251}.cream{fill:#fff8ea}
  </style>
  <text x="60" y="70" class="t xl">SNS 카드뉴스 예시안 · 모든 카드 동일 규격</text>
  <text x="60" y="108" class="m md">각 카드 1080×1350 비율 · 동일한 여백과 텍스트 안전 영역 적용</text>

  <!-- 01 -->
  <g transform="translate(60,150)"><rect width="420" height="525" rx="24" class="navy"/><text x="32" y="50" class="w sm">01 · COVER</text><circle cx="135" cy="190" r="82" fill="#e8a15c"/><circle cx="285" cy="190" r="82" fill="#c77a48"/><text x="32" y="330" class="w lg">가을 대구,</text><text x="32" y="367" class="w lg">골목과 시장을 따라</text><text x="32" y="415" class="w md">포롱이와 여울이의 탐험</text><rect x="32" y="455" width="145" height="34" rx="17" class="orange"/><text x="55" y="478" class="w sm">대구 1박 2일</text></g>
  <!-- 02 -->
  <g transform="translate(540,150)"><rect width="420" height="525" rx="24" class="cream"/><text x="32" y="50" class="t sm">02 · INTRO</text><text x="32" y="115" class="t lg">대구에서</text><text x="32" y="151" class="t lg">1박 2일을 보낸다면?</text><rect x="32" y="195" width="356" height="140" rx="18" class="navy"/><text x="60" y="245" class="w md">역사 · 먹거리</text><text x="60" y="282" class="w md">음악 · 야경</text><text x="32" y="390" class="t md">두 친구를 따라 대구의</text><text x="32" y="425" class="t md">새로운 모습을 만나보세요.</text></g>
  <!-- 03 -->
  <g transform="translate(1020,150)"><rect width="420" height="525" rx="24" class="navy"/><text x="32" y="50" class="w sm">03 · ROUTE</text><text x="32" y="115" class="w lg">코스 한눈에 보기</text><line x1="78" y1="175" x2="78" y2="395" stroke="#e98c19" stroke-width="6"/><g fill="#e98c19"><circle cx="78" cy="175" r="12"/><circle cx="78" cy="245" r="12"/><circle cx="78" cy="315" r="12"/><circle cx="78" cy="395" r="12"/></g><g class="w sm"><text x="115" y="181">근대골목 · 10:00</text><text x="115" y="251">서문시장 · 11:40</text><text x="115" y="321">김광석길 · 오후</text><text x="115" y="401">평화시장 · 저녁</text></g><text x="32" y="470" class="w md">밤에는 서문시장 야시장으로</text></g>
  <!-- 04 -->
  <g transform="translate(60,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="210" rx="24" fill="#e8a15c"/><text x="32" y="50" class="w sm">04 · MORNING</text><text x="32" y="150" class="w md">계산성당 사진 후보</text><text x="32" y="250" class="t sm">01 · 근대골목</text><text x="32" y="295" class="t lg">대구의 근대 역사와</text><text x="32" y="332" class="t lg">골목 풍경을 만나는 시간</text><text x="32" y="390" class="m sm">청라언덕 · 계산성당 · 이상화 고택</text><rect x="32" y="445" width="170" height="34" rx="17" class="orange"/><text x="53" y="468" class="w sm">크로스백 이미지</text></g>
  <!-- 05 -->
  <g transform="translate(540,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="210" rx="24" fill="#d9c6a4"/><text x="32" y="50" class="t sm">05 · LUNCH</text><text x="32" y="150" class="t md">서문시장 입구 사진 후보</text><text x="32" y="250" class="t sm">02 · 서문시장 권역</text><text x="32" y="295" class="t lg">시장 냄새를 따라가면</text><text x="32" y="332" class="t lg">대구의 맛있는 하루가 시작돼요.</text><text x="32" y="390" class="m sm">포롱이: “뭐부터 먹어볼까?”</text><text x="32" y="425" class="m sm">여울이: “다음 장소도 챙겨야 해.”</text></g>
  <!-- 06 -->
  <g transform="translate(1020,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="210" rx="24" fill="#c7c9d0"/><text x="32" y="50" class="t sm">06 · AFTERNOON</text><text x="32" y="150" class="t md">장소 사진 준비 중</text><text x="32" y="250" class="t sm">03 · 김광석 다시그리기길</text><text x="32" y="295" class="t lg">음악과 벽화가 있는</text><text x="32" y="332" class="t lg">골목을 산책해요.</text><text x="32" y="405" class="m sm">사진 확보 후 교체</text></g>
  <!-- 07 -->
  <g transform="translate(60,1320)"><rect width="420" height="525" rx="24" class="navy"/><rect x="28" y="78" width="364" height="170" rx="18" fill="#3b4669"/><text x="32" y="50" class="w sm">07 · NIGHT</text><text x="50" y="170" class="w md">서문시장 야시장 야간 사진</text><text x="32" y="305" class="w lg">별랜턴을 켜고</text><text x="32" y="342" class="w lg">밤의 대구를 탐험해요.</text><text x="32" y="395" class="w md">04 · 평화시장 → 야시장</text><text x="32" y="455" class="w sm">저녁·밤 시간대에만 랜턴 사용</text></g>
  <!-- 08 -->
  <g transform="translate(540,1320)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="170" rx="24" fill="#d7d4c6"/><text x="32" y="50" class="t sm">08 · DAY 2</text><text x="32" y="125" class="t md">동성로 거리 사진 후보</text><text x="32" y="245" class="t lg">동성로에서 여유롭게</text><text x="32" y="282" class="t lg">대구의 아침을 즐겨보세요.</text><text x="32" y="350" class="m sm">자유시간 후 신천으로 이동해</text><text x="32" y="382" class="m sm">탐험을 마무리해요.</text><rect x="32" y="440" width="150" height="34" rx="17" class="orange"/><text x="57" y="463" class="w sm">크로스백 이미지</text></g>
  <!-- 09 -->
  <g transform="translate(1020,1320)"><rect width="420" height="525" rx="24" class="orange"/><text x="32" y="50" class="w sm">09 · END</text><text x="32" y="120" class="w lg">별빛 탐험 기록</text><text x="32" y="190" class="w md">★ 근대골목</text><text x="32" y="230" class="w md">★ 서문시장</text><text x="32" y="270" class="w md">★ 김광석길</text><text x="32" y="310" class="w md">★ 평화시장</text><text x="32" y="350" class="w md">★ 서문시장 야시장</text><text x="32" y="425" class="w md">다음 탐험도 함께해요!</text><text x="32" y="470" class="w sm">[전체 코스 보기]</text></g>
</svg>
