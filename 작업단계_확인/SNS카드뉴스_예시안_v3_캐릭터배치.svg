<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1900" viewBox="0 0 1500 1900">
  <rect width="1500" height="1900" fill="#ece8df"/>
  <style>
    .t{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#202a49}.w{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#fff}.m{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#73798a}.sm{font-size:15px}.md{font-size:20px}.lg{font-size:27px;font-weight:700}.xl{font-size:38px;font-weight:700}.orange{fill:#e98c19}.navy{fill:#273251}.cream{fill:#fff8ea}.slot{fill:#e8a15c;stroke:#fff;stroke-width:3}
  </style>
  <text x="60" y="70" class="t xl">SNS 카드뉴스 예시안 · 캐릭터 배치 포함</text>
  <text x="60" y="108" class="m md">모든 카드 1080×1350 비율 · 캐릭터는 하단 안전 영역에 배치</text>

  <!-- 01 cover -->
  <g transform="translate(60,150)"><rect width="420" height="525" rx="24" class="navy"/><text x="32" y="48" class="w sm">01 · COVER</text><circle cx="135" cy="175" r="75" class="slot"/><circle cx="285" cy="175" r="75" fill="#c77a48" stroke="#fff" stroke-width="3"/><text x="32" y="295" class="w lg">가을 대구,</text><text x="32" y="332" class="w lg">골목과 시장을 따라</text><text x="32" y="375" class="w md">포롱이와 여울이의 탐험</text><text x="32" y="415" class="w sm">표지 캐릭터: 카드 높이의 약 28~32%</text><text x="32" y="465" class="w sm">포롱이·여울이 크로스백 이미지</text></g>
  <!-- 02 -->
  <g transform="translate(540,150)"><rect width="420" height="525" rx="24" class="cream"/><text x="32" y="48" class="t sm">02 · INTRO</text><text x="32" y="105" class="t lg">대구에서 1박 2일을</text><text x="32" y="140" class="t lg">보낸다면?</text><rect x="32" y="175" width="356" height="125" rx="18" class="navy"/><text x="58" y="225" class="w md">역사 · 먹거리 · 음악 · 야경</text><text x="32" y="350" class="t md">두 친구를 따라 대구의</text><text x="32" y="382" class="t md">새로운 모습을 만나보세요.</text><ellipse cx="130" cy="475" rx="55" ry="32" class="slot"/><ellipse cx="285" cy="475" rx="55" ry="32" fill="#c77a48"/><text x="32" y="515" class="m sm">하단 양쪽 · 각 카드 높이의 약 14%</text></g>
  <!-- 03 -->
  <g transform="translate(1020,150)"><rect width="420" height="525" rx="24" class="navy"/><text x="32" y="48" class="w sm">03 · ROUTE</text><text x="32" y="105" class="w lg">코스 한눈에 보기</text><line x1="78" y1="155" x2="78" y2="355" stroke="#e98c19" stroke-width="6"/><g fill="#e98c19"><circle cx="78" cy="155" r="12"/><circle cx="78" cy="220" r="12"/><circle cx="78" cy="285" r="12"/><circle cx="78" cy="355" r="12"/></g><g class="w sm"><text x="110" y="161">근대골목 · 10:00</text><text x="110" y="226">서문시장 · 11:40</text><text x="110" y="291">김광석길 · 오후</text><text x="110" y="361">평화시장 · 저녁</text></g><ellipse cx="118" cy="470" rx="58" ry="32" class="slot"/><ellipse cx="300" cy="470" rx="58" ry="32" fill="#c77a48"/><text x="32" y="515" class="w sm">하단 캐릭터로 코스 동행감 표현</text></g>
  <!-- 04 -->
  <g transform="translate(60,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="190" rx="24" fill="#e8a15c"/><text x="32" y="48" class="w sm">04 · MORNING</text><text x="32" y="135" class="w md">계산성당 사진 후보</text><text x="32" y="235" class="t sm">01 · 근대골목</text><text x="32" y="275" class="t lg">대구의 근대 역사와</text><text x="32" y="310" class="t lg">골목 풍경을 만나는 시간</text><text x="32" y="360" class="m sm">청라언덕 · 계산성당 · 이상화 고택</text><ellipse cx="330" cy="465" rx="62" ry="38" class="slot"/><text x="32" y="465" class="m sm">포롱이: 하단 오른쪽 · 약 18%</text><text x="32" y="510" class="m sm">낮용 크로스백 이미지</text></g>
  <!-- 05 -->
  <g transform="translate(540,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="190" rx="24" fill="#d9c6a4"/><text x="32" y="48" class="t sm">05 · LUNCH</text><text x="32" y="135" class="t md">서문시장 입구 사진 후보</text><text x="32" y="235" class="t sm">02 · 서문시장 권역</text><text x="32" y="275" class="t lg">시장 냄새를 따라가면</text><text x="32" y="310" class="t lg">대구의 맛있는 하루가 시작돼요.</text><text x="32" y="360" class="m sm">포롱이: “뭐부터 먹어볼까?”</text><ellipse cx="330" cy="465" rx="62" ry="38" class="slot"/><text x="32" y="465" class="m sm">포롱이 하단 오른쪽</text><text x="32" y="510" class="m sm">대사 말풍선과 겹치지 않게 배치</text></g>
  <!-- 06 -->
  <g transform="translate(1020,735)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="190" rx="24" fill="#c7c9d0"/><text x="32" y="48" class="t sm">06 · AFTERNOON</text><text x="32" y="135" class="t md">장소 사진 준비 중</text><text x="32" y="235" class="t sm">03 · 김광석 다시그리기길</text><text x="32" y="275" class="t lg">음악과 벽화가 있는</text><text x="32" y="310" class="t lg">골목을 산책해요.</text><ellipse cx="90" cy="465" rx="62" ry="38" class="slot"/><ellipse cx="250" cy="465" rx="62" ry="38" fill="#c77a48"/><text x="32" y="420" class="m sm">여울이 설명 + 포롱이 체험</text><text x="32" y="510" class="m sm">두 캐릭터 각 14~16% · 하단 좌우</text></g>
  <!-- 07 -->
  <g transform="translate(60,1320)"><rect width="420" height="525" rx="24" class="navy"/><rect x="28" y="70" width="364" height="150" rx="18" fill="#3b4669"/><text x="32" y="48" class="w sm">07 · NIGHT</text><text x="32" y="140" class="w md">서문시장 야시장 야간 사진</text><text x="32" y="275" class="w lg">별랜턴을 켜고</text><text x="32" y="310" class="w lg">밤의 대구를 탐험해요.</text><ellipse cx="105" cy="435" rx="70" ry="48" fill="#e8a15c" stroke="#ffd15c" stroke-width="4"/><ellipse cx="300" cy="435" rx="70" ry="48" fill="#c77a48" stroke="#ffd15c" stroke-width="4"/><text x="32" y="500" class="w sm">여울이·포롱이 별랜턴 이미지 · 각 약 18%</text></g>
  <!-- 08 -->
  <g transform="translate(540,1320)"><rect width="420" height="525" rx="24" class="cream"/><rect width="420" height="170" rx="24" fill="#d7d4c6"/><text x="32" y="48" class="t sm">08 · DAY 2</text><text x="32" y="120" class="t md">동성로 거리 사진 후보</text><text x="32" y="240" class="t lg">동성로에서 여유롭게</text><text x="32" y="275" class="t lg">대구의 아침을 즐겨보세요.</text><text x="32" y="335" class="m sm">자유시간 후 신천으로 이동해요.</text><ellipse cx="105" cy="450" rx="65" ry="42" class="slot"/><ellipse cx="295" cy="450" rx="65" ry="42" fill="#c77a48"/><text x="32" y="510" class="m sm">낮용 크로스백 · 각 약 16%</text></g>
  <!-- 09 -->
  <g transform="translate(1020,1320)"><rect width="420" height="525" rx="24" class="orange"/><text x="32" y="48" class="w sm">09 · END</text><text x="32" y="115" class="w lg">별빛 탐험 기록</text><text x="32" y="170" class="w md">★ 근대골목</text><text x="32" y="205" class="w md">★ 서문시장</text><text x="32" y="240" class="w md">★ 김광석길</text><text x="32" y="275" class="w md">★ 평화시장</text><text x="32" y="310" class="w md">★ 서문시장 야시장</text><ellipse cx="105" cy="450" rx="65" ry="42" fill="#e8a15c" stroke="#fff" stroke-width="3"/><ellipse cx="295" cy="450" rx="65" ry="42" fill="#c77a48" stroke="#fff" stroke-width="3"/><text x="32" y="510" class="w sm">기본은 크로스백 · 밤 분위기면 랜턴 교체</text></g>
</svg>
