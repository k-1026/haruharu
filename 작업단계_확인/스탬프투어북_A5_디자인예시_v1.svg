<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900">
  <rect width="1600" height="1900" fill="#ece8df"/>
  <style>
    .t{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#202a49}.w{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#fff}.m{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#73798a}.sm{font-size:14px}.md{font-size:18px}.lg{font-size:25px;font-weight:700}.xl{font-size:34px;font-weight:700}.navy{fill:#273251}.orange{fill:#e98c19}.cream{fill:#fff8ea}.stamp{fill:#fff;stroke:#e98c19;stroke-width:5;stroke-dasharray:8 6}
  </style>
  <text x="60" y="65" class="t xl">스탬프 투어 북 디자인 예시 · A5 세로형 8페이지</text>
  <text x="60" y="100" class="m md">포롱이와 여울이를 따라 대구의 별을 모으는 탐험 기록장</text>

  <!-- page 1 -->
  <g transform="translate(70,150)"><rect width="330" height="450" rx="12" class="navy"/><text x="28" y="45" class="w sm">P.01 · COVER</text><text x="28" y="125" class="w xl">대구의 별을</text><text x="28" y="170" class="w xl">모아보자!</text><circle cx="125" cy="285" r="74" fill="#e8a15c"/><circle cx="245" cy="285" r="74" fill="#c77a48"/><text x="28" y="405" class="w md">포롱이와 여울이의</text><text x="28" y="432" class="w md">대구 스탬프 투어</text></g>
  <!-- page 2 -->
  <g transform="translate(450,150)"><rect width="330" height="450" rx="12" class="cream"/><text x="28" y="45" class="t sm">P.02 · HOW TO</text><text x="28" y="90" class="t lg">탐험 방법</text><text x="28" y="145" class="t md">1. 장소를 방문해요</text><text x="28" y="178" class="m sm">코스와 장소를 확인하세요.</text><text x="28" y="230" class="t md">2. 미션을 수행해요</text><text x="28" y="263" class="m sm">포롱이와 여울이의 질문에 답해보세요.</text><text x="28" y="315" class="t md">3. 스탬프를 받아요</text><text x="28" y="348" class="m sm">방문을 기록하고 별을 채워요.</text><rect x="28" y="380" width="274" height="42" rx="20" class="orange"/><text x="78" y="407" class="w sm">여울이: 꼼꼼히 기록하기</text></g>
  <!-- page 3 -->
  <g transform="translate(830,150)"><rect width="330" height="450" rx="12" class="navy"/><text x="28" y="45" class="w sm">P.03 · MAP</text><text x="28" y="90" class="w lg">탐험 지도</text><path d="M55 350 C95 250,145 290,185 200 S250 205,285 140" fill="none" stroke="#FED665" stroke-width="7"/><g fill="#FED665"><circle cx="55" cy="350" r="11"/><circle cx="120" cy="270" r="11"/><circle cx="185" cy="200" r="11"/><circle cx="285" cy="140" r="11"/></g><text x="28" y="405" class="w sm">근대골목 → 서문시장</text><text x="28" y="428" class="w sm">→ 평화시장 → 야시장</text></g>
  <!-- page 4 -->
  <g transform="translate(1210,150)"><rect width="330" height="450" rx="12" class="cream"/><text x="28" y="45" class="t sm">P.04 · STAMP 01</text><text x="28" y="90" class="t lg">근대골목</text><rect x="28" y="115" width="274" height="110" rx="10" fill="#ddd6ca"/><text x="88" y="178" class="m sm">계산성당 사진 후보</text><text x="28" y="270" class="t md">미션</text><text x="28" y="302" class="m sm">가장 오래된 건물의</text><text x="28" y="325" class="m sm">특징을 한 가지 찾아보세요.</text><circle cx="235" cy="380" r="52" class="stamp"/><text x="210" y="386" class="t sm">STAMP</text><text x="28" y="430" class="m sm">도장 또는 별 스티커</text></g>
  <!-- page 5 -->
  <g transform="translate(70,690)"><rect width="330" height="450" rx="12" class="cream"/><text x="28" y="45" class="t sm">P.05 · STAMP 02</text><text x="28" y="90" class="t lg">서문시장</text><rect x="28" y="115" width="274" height="110" rx="10" fill="#d9c6a4"/><text x="80" y="178" class="m sm">서문시장 입구 사진 후보</text><text x="28" y="270" class="t md">미션</text><text x="28" y="302" class="m sm">먹어보고 싶은 시장 음식</text><text x="28" y="325" class="m sm">한 가지를 골라보세요.</text><circle cx="235" cy="380" r="52" class="stamp"/><text x="210" y="386" class="t sm">STAMP</text><text x="28" y="430" class="m sm">포롱이 추천 먹거리 기록</text></g>
  <!-- page 6 -->
  <g transform="translate(450,690)"><rect width="330" height="450" rx="12" class="cream"/><text x="28" y="45" class="t sm">P.06 · STAMP 03–04</text><text x="28" y="90" class="t lg">오후의 골목</text><text x="28" y="140" class="t md">김광석길</text><text x="28" y="170" class="m sm">사진 준비 중 · 음악과 벽화</text><text x="28" y="225" class="t md">평화시장</text><text x="28" y="255" class="m sm">사진 준비 중 · 저녁 먹거리</text><circle cx="105" cy="350" r="48" class="stamp"/><circle cx="235" cy="350" r="48" class="stamp"/><text x="81" y="356" class="t sm">STAMP</text><text x="211" y="356" class="t sm">STAMP</text><text x="28" y="420" class="m sm">낮: 크로스백 · 저녁: 별랜턴</text></g>
  <!-- page 7 -->
  <g transform="translate(830,690)"><rect width="330" height="450" rx="12" class="navy"/><text x="28" y="45" class="w sm">P.07 · STAMP 05–06</text><text x="28" y="90" class="w lg">밤과 다음 날</text><text x="28" y="140" class="w md">서문시장 야시장</text><rect x="28" y="165" width="274" height="95" rx="10" fill="#3b4669"/><text x="65" y="220" class="w sm">야간 사진 후보</text><text x="28" y="300" class="w md">동성로 · 신천</text><text x="28" y="330" class="w sm">DAY 2 자유시간과 산책</text><circle cx="105" cy="395" r="42" class="stamp"/><circle cx="235" cy="395" r="42" class="stamp"/><text x="82" y="401" class="t sm">STAMP</text><text x="212" y="401" class="t sm">STAMP</text></g>
  <!-- page 8 -->
  <g transform="translate(1210,690)"><rect width="330" height="450" rx="12" class="orange"/><text x="28" y="45" class="w sm">P.08 · COMPLETE</text><text x="28" y="100" class="w lg">탐험 완료!</text><text x="28" y="150" class="w md">대구의 별을 모두 모았어요.</text><text x="28" y="220" class="w md">★ ★ ★</text><text x="28" y="255" class="w md">★ ★ ★</text><rect x="28" y="295" width="274" height="65" rx="10" fill="#fff" opacity=".9"/><text x="52" y="335" class="t sm">완주 날짜: __________</text><rect x="28" y="380" width="274" height="40" rx="20" class="navy"/><text x="86" y="406" class="w sm">다음 코스 보기 QR</text></g>

  <text x="70" y="1240" class="t lg">구성 원칙</text><text x="70" y="1285" class="m md">장소 방문 → 미션 수행 → 스탬프 기록 → 별빛 지도 완성</text><text x="70" y="1325" class="m md">낮에는 크로스백, 저녁·밤에는 별랜턴 캐릭터를 사용합니다.</text>
  <rect x="70" y="1380" width="1460" height="240" rx="24" fill="#fff"/><text x="105" y="1430" class="t lg">인쇄 제작 메모</text><text x="105" y="1475" class="m sm">• 실제 인쇄본은 A5 세로형 8페이지 중철 제본 또는 소책자 형태를 권장</text><text x="105" y="1510" class="m sm">• 스탬프 칸은 실제 도장 또는 별 스티커가 들어갈 수 있도록 여백 확보</text><text x="105" y="1545" class="m sm">• 김광석길·평화시장 사진은 확보 전까지 자리 표시 영역 유지</text><text x="105" y="1580" class="m sm">• 야간 페이지에는 별랜턴 캐릭터와 야시장 사진을 함께 배치</text>
</svg>
