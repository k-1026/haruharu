    .white{fill:#fff;font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}
    .small{font-size:18px}.body{font-size:22px}.title{font-size:38px;font-weight:700}.h2{font-size:28px;font-weight:700}.bold{font-weight:700}
  </style>
  <rect x="60" y="45" width="1320" height="78" rx="20" fill="#fff"/>
