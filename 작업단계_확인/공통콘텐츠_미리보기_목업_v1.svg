  <g class="white small" text-anchor="middle"><text x="140" y="1655">근대골목</text><text x="330" y="1655">서문시장</text><text x="520" y="1655">김광석길</text><text x="710" y="1655">평화시장</text><text x="900" y="1655">동성로</text><text x="1100" y="1655">다음 탐험</text></g>
